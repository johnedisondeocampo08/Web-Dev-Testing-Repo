services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: obp
      POSTGRES_USER: obp
      POSTGRES_PASSWORD: obp
    ports:
      - "5432:5432"
    volumes:
      - obp-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obp -d obp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  obp-postgres:
